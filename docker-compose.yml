services:
  postgres:
    image: postgres:16-alpine
    container_name: mesos-db
    environment:
      POSTGRES_DB: mesos
      POSTGRES_USER: mesos
      POSTGRES_PASSWORD: mesos
    ports:
      - "5432:5432"
    volumes:
      - mesos-pg-data:/var/lib/postgresql/data
      - ./Mesos/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped

volumes:
  mesos-pg-data: